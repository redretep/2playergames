<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>2 Player Games</title>
<style>
body {
  font-family: Arial, sans-serif;
  background: #111;
  color: white;
  text-align: center;
  margin: 0;
  padding: 40px;
}

h1 {
  margin-bottom: 30px;
}

.games {
  display: flex;
  flex-wrap: wrap;
  justify-content: center;
  gap: 15px;
}

a {
  text-decoration: none;
  background: #222;
  padding: 15px 25px;
  border-radius: 10px;
  color: white;
  transition: 0.2s;
}

a:hover {
  background: #444;
}
</style>
</head>
<body>

<h1>2 Player Games</h1>

<div class="games" id="games"></div>

<script>
async function loadGames() {
  const response = await fetch("gamelist.json");
  const games = await response.json();

  const container = document.getElementById("games");

  games.forEach(game => {
    const link = document.createElement("a");
    link.href = game.file;
    link.textContent = game.name;
    container.appendChild(link);
  });
}

loadGames();
</script>

</body>
</html>
